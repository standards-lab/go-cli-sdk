# golangci-lint v2 configuration, run per module by `mise run check`: the standard set plus
# depguard, testpackage, and nolintlint.
# See architecture/standards/go-elemental/principles/dependencies.md
# See architecture/standards/go-elemental/principles/tests-and-docs.md
# See architecture/principles/comments.md
version: "2"

linters:
  default: standard
  enable:
    - depguard
    - nolintlint
    - testpackage
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true
    testpackage:
      skip-regexp: export_test\.go
    depguard:
      rules:
        module:
          list-mode: strict
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/standards-lab/go-core$
            - github.com/standards-lab/go-core/
            - github.com/standards-lab/go-cli-sdk$
            - github.com/standards-lab/go-cli-sdk/
