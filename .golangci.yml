# golangci-lint v2 configuration, run per module by `mise run check`.
version: "2"

linters:
  # The standard set (errcheck, govet, ineffassign, staticcheck, unused),
  # plus depguard, which holds the module to its allowed imports, and
  # testpackage, which keeps tests black-box. Its skip regexp is narrowed
  # to export_test.go: tests live in <pkg>_test and drive the exported
  # API, and the one white-box file allowed is export_test.go, which only
  # exports a clock or probe hook the API cannot reach.
  default: standard
  enable:
    - depguard
    - testpackage
  settings:
    testpackage:
      skip-regexp: export_test\.go
    depguard:
      rules:
        # The module depends on nothing but the standard library and
        # go-core. The rule covers every Go file, tests included: they
        # drive the API with the same imports plus the module itself.
        # Allow entries match by prefix unless they end in `$`, so each is
        # anchored: go-core as the exact module path or a path under it
        # (not a sibling like go-core-extra), and the module as itself or
        # a package under it (not a sibling like go-cli-sdk-extra).
        module:
          list-mode: strict
          files:
            - "**/*.go"
          allow:
            - $gostd
            - github.com/standards-lab/go-core$
            - github.com/standards-lab/go-core/
            - github.com/standards-lab/go-cli-sdk$
            - github.com/standards-lab/go-cli-sdk/
